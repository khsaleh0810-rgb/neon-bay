<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solmar Bay — a top-down open-world story</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0d1b2a;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #wrap {
    width: 1280px;
    max-width: 100vw;
    aspect-ratio: 16 / 9;
    position: relative;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #0d1b2a;
    border-radius: 6px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
